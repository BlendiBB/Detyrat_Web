<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider</title>

    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

/* Page background */
body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1e1e2f, #2c2c44);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Main container */
#kontenti {
    background-color: #ffffff;
    padding: 25px 30px;
    border-radius: 12px;
    width: 350px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
}

/* Header title */
header h2 {
    margin-bottom: 15px;
    color: #333;
}

/* Slideshow image */
#slideshow {
    width: 280px;
    height: 280px;
    object-fit: contain;
    border-radius: 10px;
    border: 2px solid #ddd;
    transition: opacity 0.3s ease-in-out;
}

/* Buttons container */
.buttons {
    margin-top: 15px;
    display: flex;
    justify-content: space-between;
}

/* Buttons */
.buttons button {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background-color: #4a5cff;
    color: white;
    font-size: 14px;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.2s ease;
}

/* Hover effect */
.buttons button:hover {
    background-color: #3746e0;
    transform: scale(1.05);
}

/* Active (click) effect */
.buttons button:active {
    transform: scale(0.95);
}
    </style>
</head>
<body>
    <div id="kontenti">
        <header>
            <h2>Slide Show</h2>
            <img name="mySlide" id="slideshow" src="Newyork.png" alt="Slider Photo">
        </header>
        <div class="buttons">
            <button onclick="prevImg()">Previous</button>
            <button onclick="nextImg()">Next</button>
        </div>
    </div>

    <script>
        var i = 0;

        var imgArray = [
            "https://i.pinimg.com/280x280_RS/1c/b5/61/1cb561c8e7b9c709f78d110a4b5f0863.jpg",
            "https://z-m-static.xx.fbcdn.net/rsrc.php/v4/yD/r/5D8s-GsHJlJ.png",
            "https://store-images.s-microsoft.com/image/apps.3793.13634052595610511.c45457c9-b4af-46b0-8e61-8d7c0aec3f56.bbc8b3d1-941b-42c2-a610-e100e2aae247",
            "https://upload.wikimedia.org/wikipedia/commons/d/d7/Ubtlogo.png"
        ]

        function nextImg(){
            i = (i + 1) % imgArray.length;
            document.getElementById("slideshow").src = imgArray[i];
        }

        function prevImg(){
            i = (i - 1 + imgArray.length) % imgArray.length;
            document.getElementById("slideshow").src = imgArray[i];
        }
    </script>
</body>
</html>
